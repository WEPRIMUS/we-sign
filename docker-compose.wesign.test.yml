# WE Sign (DocuSeal base) - test harness: the upstream RSpec suite against a throw-away PostgreSQL.
#
#   docker compose -f docker-compose.wesign.test.yml run --build --rm wesign-ds-test bundle exec rspec spec/requests/templates_spec.rb
#   docker compose -f docker-compose.wesign.test.yml down
#
# No published ports, no secrets, no volumes, no host folders: the source is copied into the test image
# (--build refreshes it, a few seconds after a Ruby or spec change) and the database lives in memory.

name: wesign-ds-test

services:
  wesign-ds-test-postgres:
    image: postgres:18.6
    container_name: wesign-ds-test-postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust     # throw-away database: no password, reachable only inside this network
      POSTGRES_DB: docuseal_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "docuseal_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  wesign-ds-test:
    build:
      context: .
      dockerfile: Dockerfile.wesign.test
    image: wesign-ds/test:local
    environment:
      DATABASE_URL: postgres://postgres@wesign-ds-test-postgres:5432/docuseal_test
    depends_on:
      wesign-ds-test-postgres:
        condition: service_healthy
